x-app-image: &app-image localhost/${COMPOSE_PROJECT_NAME:-sensewell}-app:local

services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: sensewell
      POSTGRES_USER: sensewell_admin
      POSTGRES_PASSWORD: local-admin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: *app-image
    pull_policy: never
    command: ["node", "node_modules/@sensewell/database/dist/migrate.js"]
    environment:
      DATABASE_MIGRATION_URL: postgresql://sensewell_admin:local-admin@db:5432/sensewell
      DATABASE_APP_PASSWORD: local-app
    depends_on:
      db:
        condition: service_healthy

  app:
    image: *app-image
    build: .
    environment:
      DATABASE_URL: postgresql://sensewell_app:local-app@db:5432/sensewell
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-compose-only-e6c3b5894fc47c631b7b282d47fcb37e}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://127.0.0.1:3000}
      CLIP_STORAGE_DIR: /app/clips
      IP_CAMERA_ENDPOINTS: ${IP_CAMERA_ENDPOINTS:-}
      RECORDING_STORAGE_DIR: /app/recordings
    volumes:
      - camera-clips:/app/clips
      - camera-recordings:/app/recordings
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${SENSEWELL_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exitCode = 1 })"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  camera-clips:
  camera-recordings:
